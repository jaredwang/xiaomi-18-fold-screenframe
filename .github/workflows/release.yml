# Builds a signed release APK and publishes it as a GitHub Release.
#
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#          or run it by hand from the Actions tab with a version number.
# Needs the SIGNING_* secrets created by android/scripts/setup-release-signing.sh.
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (creates tag v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Run android/scripts/setup-release-signing.sh once."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$RUNNER_TEMP/ScreenFrame-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Screen Frame $TAG** · 带壳截图 $TAG

          Download \`ScreenFrame-$VERSION_NAME.apk\` below and open it on your phone to install (Android 13+).
          下载下方的 \`ScreenFrame-$VERSION_NAME.apk\`，在手机上打开即可安装（需要 Android 13 及以上）。
          EOF
          RELEASE_FLAGS=()
          if [[ "$VERSION_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "$APK" \
            --title "Screen Frame $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            "${RELEASE_FLAGS[@]}"
