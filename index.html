<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F5F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>带壳截图</title>
  </head>
  <body>
    <header class="bar">
      <h1>18 Fold 带壳截图</h1>
      <label class="button primary">
        选择截图
        <input id="file" type="file" accept="image/*" multiple hidden />
      </label>
    </header>

    <details class="options" open>
      <summary>外观</summary>
      <div class="row">
        <span class="label">背景</span>
        <div class="seg">
          <label><input type="radio" name="background" value="light" /><span>浅灰</span></label>
          <label><input type="radio" name="background" value="dark" /><span>深色</span></label>
          <label><input type="radio" name="background" value="transparent" /><span>透明</span></label>
          <label>
            <input id="bg-custom-radio" type="radio" name="background" value="custom" />
            <span>自定义 <input id="bg-custom" type="color" value="#E8EEF5" aria-label="自定义背景色" /></span>
          </label>
        </div>
      </div>
      <div class="row">
        <span class="label">边距</span>
        <div class="seg">
          <label><input type="radio" name="padding" value="0" /><span>无</span></label>
          <label><input type="radio" name="padding" value="0.06" /><span>紧凑</span></label>
          <label><input type="radio" name="padding" value="0.12" /><span>适中</span></label>
          <label><input type="radio" name="padding" value="0.18" /><span>宽松</span></label>
        </div>
      </div>
      <div class="row">
        <span class="label">圆角</span>
        <input id="radius" type="range" min="0.5" max="1.3" step="0.05" />
        <output id="radius-out"></output>
      </div>
      <div class="row">
        <label class="check"><input id="shadow" type="checkbox" /> 投影</label>
        <button id="reset" class="link">恢复默认</button>
      </div>
      <div class="row templates">
        <span class="label">外壳</span>
        <a href="./templates/fold18-folded.png" download>折叠</a>
        <a href="./templates/fold18-unfolded-portrait.png" download>展开竖屏</a>
        <a href="./templates/fold18-unfolded-landscape.png" download>展开横屏</a>
        <span class="hint">透明 PNG，原生分辨率</span>
      </div>
    </details>

    <div id="bulk" class="bulk" hidden>
      <button id="share-all" class="primary">全部分享</button>
      <button id="zip-all">打包下载 zip</button>
      <button id="clear-all">清空</button>
    </div>
    <div id="status" class="status" hidden></div>

    <div id="empty" class="empty">
      <p>选择或拖入 18 Fold 截图（内屏 / 外屏、横竖屏均可）</p>
      <p class="hint">安装到桌面后，可以在相册里「分享 → 带壳截图」直接打开</p>
    </div>
    <main id="grid" class="grid"></main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
